[gcode_macro _VARS_TX]                                # <== replace X in macro name with toolhead ID
variable_dock_position:       {'x': XX.X, 'y': YY.Y}  # dock position of this tool
variable_nozzle_offset_x:     0.0                     # nozzle x offset, relative to tool 0 nozzle position
variable_nozzle_offset_y:     0.0                     # nozzle y offset, relative to tool 0 nozzle position
variable_nozzle_offset_z:     0.0                     # nozzle z offset, relative to tool 0 nozzle position
variable_has_hall_sensor:     False                   # [True/False] if a hall sensor is installed in the dock
gcode:

[extruderX]                         # <== replace X in config name with toolhead ID
nozzle_diameter: 0.400              # adjust to used nozzle diameter
filament_diameter: 1.75
max_extrude_cross_section: 5.0      # to allow for most purges
max_extrude_only_distance: 101.0    # to allow calibration
heater_pin: XXX                     # change pin
sensor_pin: XXX                     # change pin
sensor_type: Generic 3950
min_temp: 0.0
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
control: pid                        # do PID tuning
pid_kp: 10
pid_ki: 0.0
pid_kd: 0.0

[heater_fan dock_fan_tX]		    # <== replace X in macro name with toolhead ID
pin: XXX                            # change pin
max_power: 1.0
heater: extruderX                   # <== replace X with toolhead ID
heater_temp: 50.0

# Optional hall sensor support (work in progress)
#[gcode_button dock_hall_sensor_tX] # <== replace X in macro name with toolhead ID
#pin: XXX                           # change pin
#debounce_delay: 0.2
#press_gcode:
#release_gcode:

[gcode_macro TX]                    # <== replace X in macro name with toolhead ID
gcode: CHANGE_TOOL TOOL=X           # <== replace X with toolhead ID
