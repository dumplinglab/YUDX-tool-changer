[gcode_macro _TOOLHEAD_CFG]
variable_tool_count:            2     # how many tools are installed
variable_cmd_before_docking:    ''    # gcode/macro to be executed before docking starts. for example when the docks are moved by a stepper
variable_cmd_after_docking:     ''    # gcode/macro to be executed after docking is finished. for example when the docks are moved by a stepper
variable_dock_fixed_to_gantry:  True  # [True/False] True = dock is always at the same height as the gantry, False = gantry need to move to Z position for docking
variable_dock_position_z:       0     # defines dock position, when variable_dock_fixed_to_gantry = 'False'
variable_dock_direction:        'Y+'  # [Y+/Y-/X+/X-] Y+ -> toolhead moves back to engage the dock
variable_dock_clearance:        50    # how many mm to stay away from the dock when traveling to dock position 
variable_push_distance:         1     # how many additional mm to push in to engage the latch
variable_extruder_open_dist:    5     # mm of extrusion needed to open the extruder gears
variable_extruder_close_dist:   6     # mm of extrusion needed to close the extruder gears
variable_docking_speed:         60    # how fast to push into the latch (mm/s)
variable_travel_speed:          120   # how fast move into position (mm/s)
variable_extruder_speed:        30    # how fast move into position (mm/s)
variable_z_hop_before_travel:   True  # [True/False] True = z_hop before moving to the dock position
variable_z_hop_dist:            5     # mm of z_hop
variable_retract_before_travel: True  # [True/False] True = retract extruder before traveling to prevent oozing
variable_retract_dist:          1     # mm of retract. !!! be careful, too much retraction will open the extruder gears
variable_has_hall_sensor:       False # [True/False] if a hall sensor is installed in the toolhead
variable_use_dummy_extruder:    False # [True/False] True = use a dummy extruder when no toolhead is loaded. This requires a unused pin on the mainboard for heater control. See below for configuration of the dummy extruder.
gcode:

# The macros use save_variables to store the currently loaded toolhead to the file system. 
# Make sure it is enabled in printer.cfg, or enable it here by uncommenting the two lines below
#[save_variables]
#filename: ~/printer_data/config/variables.cfg

# part cooling fan
[fan]
pin: PE5                     # change pin

# cold end cooling fan in the toolhead
[heater_fan hotend_fan]
pin: PA8                     # change pin
heater: extruder, extruder1  # a list of every used extruder (toolhead). Add additional extruders if configured
heater_temp: 50.0

# probe switch mounted on the toolhead
[probe]
pin: PG13                    # change pin
x_offset: 3.0                # set probe offset
y_offset: 12.0               # set probe offset
z_offset: 3.0                # calibrate probe offset with tool 0
speed: 2.5
samples: 3
samples_result: average
sample_retract_dist: 1.0
samples_tolerance: 0.05
samples_tolerance_retries: 10

# Optional hall sensor support (work in progress)
#[gcode_button toolhead_hall_sensor]
#pin: EXP1_2                  # change pin
#debounce_delay: 0.2
#press_gcode:
#release_gcode:

