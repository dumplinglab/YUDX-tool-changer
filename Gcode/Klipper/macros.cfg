# automated config check
[delayed_gcode _TOOLCHANGER_CONFIG_CHECK]
initial_duration: 2.0
gcode:
  SET_GCODE_VARIABLE MACRO=_CONFIG_CHECK_END VARIABLE=error_detected VALUE=0

  # verify [save_variables] is enabled
  {% if printer.save_variables.variables is not defined %} 
    _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: section [save_variables] must be defined in config" 
  {% endif %}
  
  # init tool variable to -1
  {% if printer.save_variables.variables.current_tool_id is not defined %} 
    SAVE_VARIABLE VARIABLE=current_tool_id VALUE=-1 
  {% endif %}
  
  # verify [gcode_macro _TOOLHEAD_CFG] is present
  {% if printer['gcode_macro _TOOLHEAD_CFG'] is not defined %} 
    _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: section [gcode_macro _TOOLHEAD_CFG] is missing"
  {% endif %}
  
  # number of tools is plausible
  {% if printer['gcode_macro _TOOLHEAD_CFG'].tool_count is not defined %}
    _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: variable_tool_count in [gcode_macro _TOOLHEAD_CFG] is missing"
  {%else %}
    {% if printer['gcode_macro _TOOLHEAD_CFG'].tool_count < 1 or printer['gcode_macro _TOOLHEAD_CFG'].tool_count > 32 %}
      _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: variable_tool_count in [gcode_macro _TOOLHEAD_CFG] is not plausible"    
    {% endif %}
  {% endif %}
  
  # verify toolhead hall sensor is defined
  {% if printer['gcode_macro _TOOLHEAD_CFG'].has_hall_sensor is not defined %}
    _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: variable_has_hall_sensor in [gcode_macro _TOOLHEAD_CFG] is missing"    
  {% else %}
    {% if printer['gcode_macro _TOOLHEAD_CFG'].has_hall_sensor == True %}
      {% if printer['gcode_button toolhead_hall_sensor'] is not defined %}
        _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: section [gcode_button toolhead_hall_sensor] is missing" 
      {% endif %}
    {% endif %}
  {% endif %}

  # verify dummy extruder is defined if variable_use_dummy_extruder is True
  {% if printer['gcode_macro _TOOLHEAD_CFG'].use_dummy_extruder is defined and printer['gcode_macro _TOOLHEAD_CFG'].use_dummy_extruder == True %}
    {% set dummy_extruder_id = printer['gcode_macro _TOOLHEAD_CFG'].tool_count %}
    {% set dummy_extruder_name = "extruder" ~ dummy_extruder_id %}
    {% if printer.configfile.settings[dummy_extruder_name] is not defined %}
      {% set msg = "Toolchanger: Error: section [" ~ dummy_extruder_name ~ "] is missing" %}
      _PRINT_CONFIG_ERROR MSG='{msg}'
    {% endif %}
  {% endif %}
  
  # verify hotend_fan of toolhead is defined
  {% if printer.configfile.settings["heater_fan hotend_fan"] is not defined %}
    _PRINT_CONFIG_ERROR MSG="Toolchanger: Error: section [heater_fan hotend_fan] is missing"
  {% endif %}
  
  # verify for all toolheads: configs, fans, extruders, etc.
  {% for i in range (printer['gcode_macro _TOOLHEAD_CFG'].tool_count|int) %}
    # verify extruder is defined
    {% set extruder_cfg = "extruder" ~ ("" if i == 0 else i) %}
    {% if printer.configfile.settings[extruder_cfg] is not defined %}
      {% set msg = "Toolchanger: Error: section [" ~ extruder_cfg ~ "] is missing" %}
      _PRINT_CONFIG_ERROR MSG='{msg}'
    {% endif %}
    
    # verify dock cooling fan is defined
    {% if printer.configfile.settings["heater_fan dock_fan_t" ~ i] is not defined %}
      {% set msg = "Toolchanger: Error: section [heater_fan dock_fan_t" ~ i ~ "] is missing" %}
      _PRINT_CONFIG_ERROR MSG='{msg}'
    {% endif %}
    
    # verify extruder was added to hotend_fan
    {% if extruder_cfg not in printer.configfile.settings['heater_fan hotend_fan'].heater %}
      {% set msg = "Toolchanger: Error: section [heater_fan hotend_fan] does not contain the heater: " ~ extruder_cfg %}
      _PRINT_CONFIG_ERROR MSG='{msg}'
    {% endif %}
    
    # verify extruder variables are defined
    {% if printer["gcode_macro _VARS_T" ~ i] is not defined %} 
      {% set msg = "Toolchanger: Error: section [gcode_macro _VARS_T" ~ i ~ "] is missing" %}
      _PRINT_CONFIG_ERROR MSG='{msg}' 
    {% endif %}
    
    # verify hall sensor is defined
    {% if printer["gcode_macro _VARS_T" ~ i].has_hall_sensor is not defined %}
      {% set msg = "Toolchanger: Error: variable_has_hall_sensor in [gcode_macro _VARS_T" ~ i ~ "] is missing" %}
      _PRINT_CONFIG_ERROR MSG='{msg}'
    {% else %}
      {% if printer["gcode_macro _VARS_T" ~ i].has_hall_sensor == True %}
        {% if printer['gcode_button dock_hall_sensor_t' ~ i] is not defined %}
          {% set msg = "Toolchanger: Error: section [gcode_button dock_hall_sensor_t" ~ i ~ "] is missing" %}
          _PRINT_CONFIG_ERROR MSG='{msg}'
        {% endif %}
      {% endif %}
    {% endif %}
    
    # verify tool change macro is defined
    {% if printer['gcode_macro T' ~ i] is not defined %}
      {% set msg = "Toolchanger: Error: section [gcode_macro T" ~ i ~ "] is missing" %}
      _PRINT_CONFIG_ERROR MSG='{msg}'
    {% endif %}
  {% endfor %}

  _CONFIG_CHECK_END

[gcode_macro _CONFIG_CHECK_END]
variable_error_detected: 0
gcode:
  {% if printer["gcode_macro _CONFIG_CHECK_END"].error_detected == 0 %}
    RESPOND MSG="Config Check [OK]"

    # restore current tool from ID stored in save_variables
    {% set tool_id = printer.save_variables.variables.current_tool_id|default(-1)|int %}
    RESPOND MSG="Toolchanger: Restoring saved tool state: T{tool_id}"
    SET_CURRENT_TOOL TOOL={tool_id}
  {% else %}
    {action_raise_error("Config Check [FAILED], fix errors before using toolchanger")}
  {% endif %}  

[gcode_macro _PRINT_CONFIG_ERROR]
description: Workaround for Klipper bug, where action_raise_error() does not work in delayed_gcode
gcode:
    {% set msg = params.MSG|default("") %}
    SET_GCODE_VARIABLE MACRO=_CONFIG_CHECK_END VARIABLE=error_detected VALUE=1 
    RESPOND MSG="{msg}"

[gcode_macro SET_CURRENT_TOOL]
description: Declare manually mounted tool {ID}. usage: SET_CURRENT_TOOL TOOL={ID}
gcode:
    {% set tool_id = params.TOOL|default(-99)|int %}
    {% set config = printer['gcode_macro _TOOLHEAD_CFG'] %}

    {% if tool_id >= -1 and tool_id < config.tool_count %}
        SAVE_VARIABLE VARIABLE=current_tool_id VALUE={tool_id}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

        {% if tool_id == -1 %}
            RESPOND MSG="No tool mounted"
        {% else %}
            RESPOND MSG="Tool T{tool_id} manually declared"
        {% endif %}
    {% else %}
        {action_raise_error("Invalid tool. Valid range: -1 to T" ~ (config.tool_count - 1))}
    {% endif %}

# this docks the current tool and loads the new tool
[gcode_macro CHANGE_TOOL]
description: Change tool to tool with {ID}. ID=-1 -> no new tool. usage: CHANGE_TOOL TOOL={ID}
gcode:
  {% set config = printer['gcode_macro _TOOLHEAD_CFG'] %}

  # parameters
  {% set new_tool_id = params.TOOL|default(-2)|int %}

  {% if new_tool_id < -1 or new_tool_id >= config.tool_count %}
    {action_raise_error("TOOL parameter must be provided. Valid range: -1 to " ~ (config.tool_count - 1))}
  {% endif %}

  # internal variables
  {% set current_tool_id = printer.save_variables.variables.current_tool_id|default(-1)|int %}
  {% if config.use_dummy_extruder == True %}
    {% set current_tool_name = "extruder" ~ config.tool_count if current_tool_id < 0 else "extruder" if current_tool_id == 0 else "extruder" ~ current_tool_id %}
    {% set new_tool_name = "extruder" ~ config.tool_count if new_tool_id < 0 else "extruder" if new_tool_id == 0 else "extruder" ~ new_tool_id %}
  {% else %}
    {% set current_tool_name = "extruder" if current_tool_id < 0 else "extruder" ~ current_tool_id %} 
    {% set new_tool_name = "extruder" if new_tool_id < 0 else "extruder" ~ new_tool_id %}
  {% endif %}

  # if requested tool is not already attached
  {% if current_tool_id != new_tool_id %}

    # store gcode state to move back later
    SAVE_GCODE_STATE NAME=toolchange

    # execute gcode before docking
    {config.cmd_before_docking}

    # z_hop
    {% if config.z_hop_before_travel == True %}
      G91
      G0 Z{config.z_hop_dist} F{config.travel_speed * 60}
    {% endif %}

    {% if config.retract_before_travel == True and current_tool_id >= 0 %}
      G91
      G0 E-{config.retract_dist} F{config.travel_speed * 60}
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    # use absolute coordinates
    G90

    # move Z if needed
    {% if config.dock_fixed_to_gantry == False %} G0 Z{config.dock_position_z} F{config.travel_speed * 60} {% endif %}

    # dock current tool
    {% if current_tool_id >= 0 %} 
      _TOOLCHANGER_DOCK_LOAD_TOOL TOOL={current_tool_id} DOCK=1
    {% endif %}

    # pickup new tool
    {% if new_tool_id >= 0 %} 
      _TOOLCHANGER_DOCK_LOAD_TOOL TOOL={new_tool_id} DOCK=0
    {% endif %}

    # clear previous sync of [extruder]
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE={new_tool_name}
    # set active extruder to new tool for temperature safety checks when extruding
    ACTIVATE_EXTRUDER EXTRUDER={new_tool_name}
    # sync stepper of [extruder] to new tool
    {% if new_tool_id > 0 %} SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE={new_tool_name} {% endif %}

    # execute gcode after docking
    {config.cmd_after_docking}

    # return back to original position
    RESTORE_GCODE_STATE NAME=toolchange MOVE=1 MOVE_SPEED={config.travel_speed * 60}
  {% endif %}

# internal macro to do the docking and loading of the toolheads
[gcode_macro _TOOLCHANGER_DOCK_LOAD_TOOL]
gcode:
  {% set tool_id = params.TOOL|default(0)|int %}
  {% set docking = params.DOCK|int %}
  {% set tool_vars = printer["gcode_macro _VARS_T" ~ tool_id] %}
  {% set config = printer['gcode_macro _TOOLHEAD_CFG'] %}
  
  {% if config.dock_direction == 'X+' %}
    {% set start_position = {'x': tool_vars.dock_position.x - config.dock_clearance, 'y': tool_vars.dock_position.y}%}
    {% set push_position  = {'x': tool_vars.dock_position.x + config.push_distance, 'y': tool_vars.dock_position.y}%}
  {% endif %}
  
  {% if config.dock_direction == 'X-' %}
    {% set start_position = {'x': tool_vars.dock_position.x + config.dock_clearance, 'y': tool_vars.dock_position.y}%}
    {% set push_position  = {'x': tool_vars.dock_position.x - config.push_distance, 'y': tool_vars.dock_position.y}%}
  {% endif %}
  
  {% if config.dock_direction == 'Y+' %}
    {% set start_position = {'x': tool_vars.dock_position.x, 'y': tool_vars.dock_position.y - config.dock_clearance}%}
    {% set push_position  = {'x': tool_vars.dock_position.x, 'y': tool_vars.dock_position.y + config.push_distance}%}
  {% endif %}
  
  {% if config.dock_direction == 'Y-' %}
    {% set start_position = {'x': tool_vars.dock_position.x, 'y': tool_vars.dock_position.y + config.dock_clearance}%}
    {% set push_position  = {'x': tool_vars.dock_position.x, 'y': tool_vars.dock_position.y - config.push_distance}%}
  {% endif %}
  
  # move in front of dock
  G0 X{start_position.x} Y{start_position.y} F{config.travel_speed * 60}
  # open extruder on pickup
  {% if docking == 0 %} G0 E-{config.extruder_open_dist} F{config.extruder_speed * 60} {% endif %}
  # push toolhead into latch
  G0 X{push_position.x} Y{push_position.y} F{config.docking_speed * 60}
  # close extruder on pickup
  {% if docking == 0 %} G0 E{config.extruder_close_dist} F{config.extruder_speed * 60} {% endif %}
  # open extruder on docking
  {% if docking == 1 %} G0 E-{config.extruder_open_dist} F{config.extruder_speed * 60} {% endif %}
  # move back out
  G0 X{start_position.x} Y{start_position.y} F{config.travel_speed * 60}
  # close extruder on docking
  {% if docking == 1 %} G0 E{config.extruder_close_dist} F{config.extruder_speed * 60} {% endif %}
  # apply gcode offset
  SET_GCODE_OFFSET X={tool_vars.nozzle_offset_x} Y={tool_vars.nozzle_offset_y} Z={tool_vars.nozzle_offset_z} MOVE=1
  # update new tool in SAVE_VARIABLE
  {% if docking == 1 %} 
    SAVE_VARIABLE VARIABLE=current_tool_id VALUE=-1
  {% else %}
    SAVE_VARIABLE VARIABLE=current_tool_id VALUE={tool_id}
  {% endif %}
