[gcode_macro _VARS_T0]
variable_dock_position:       {'x': 10.0, 'y': 0.0}   # dock position of this tool
variable_nozzle_offset_x:     0.0                     # nozzle x offset, leave this at 0.0 for tool 0
variable_nozzle_offset_y:     0.0                     # nozzle y offset, leave this at 0.0 for tool 0
variable_nozzle_offset_z:     0.0                     # nozzle z offset, leave this at 0.0 for tool 0
variable_has_hall_sensor:     False                   # [True/False] if a hall sensor is installed in the dock
gcode:

# This is the main extruder mounted on the toolhead
# it controlls the extruder stepper for all tools and heater of T0
[extruder]
step_pin: PE2                     # change pin
dir_pin: !PE3                     # change pin
enable_pin: !PD4                  # change pin
rotation_distance: 10.0           # calibrate rotation_distance
gear_ratio: 46:10, 21:24
microsteps: 32
nozzle_diameter: 0.400            # adjust to used nozzle diameter
filament_diameter: 1.75
max_extrude_cross_section: 5.0    # to allow for most purges
max_extrude_only_distance: 101.0  # to allow calibration
heater_pin: PA2                   # change pin
sensor_pin: PF4                   # change pin
sensor_type: Generic 3950
min_temp: 0.0
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
control: pid                      # do PID tuning
pid_kp: 25.0
pid_ki: 7.0
pid_kd: 25.0

# If using controllable TMC drivers, dont forget to add the TMC section here.
# for example:
#[tmc2209 extruder]
#uart_pin: PE1                   # change pin
#run_current: 0.60

[heater_fan dock_fan_t0]
pin: EXP1_3                       # change pin
heater: extruder
heater_temp: 50.0

# Optional hall sensor support (work in progress)
#[gcode_button dock_hall_sensor_t0]
#pin: EXP1_1                      # change pin
#debounce_delay: 0.2
#press_gcode:
#release_gcode:

[gcode_macro T0]
gcode: CHANGE_TOOL TOOL=0
